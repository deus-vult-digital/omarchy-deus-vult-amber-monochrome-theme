# Deus Vult Amber Monochrome: P3 amber phosphor on a dark CRT field (deusvult.digital).
# Background, foreground, accent and borders are the P3 ramp. The ANSI
# colours are the same in every Deus Vult phosphor (the site's other phosphors
# and a plain red), so errors, warnings and diffs still read as what they are.
# Generated by tools/build.py from phosphors.toml.

mode = "dark"

accent = "#f59e0b"
selection = "#78350f"
muted = "#746144"

background = "#0b0803"
dark_background = "#070502"
darker_background = "#020100"
lighter_background = "#1a1208"

foreground = "#fcd34d"
dark_foreground = "#b45309"
light_foreground = "#fde68a"
bright_foreground = "#fef3c7"

hyprland_active_border = "rgba(fbbf24ee) rgba(b45309ee) 45deg"
hyprland_inactive_border = "rgba(78350faa)"

red = "#f87171"
yellow = "#fbbf24"
orange = "#fb923c"
green = "#22c55e"
cyan = "#2dd4bf"
blue = "#60a5fa"
magenta = "#c084fc"
brown = "#b45309"

bright_red = "#fca5a5"
bright_yellow = "#fde68a"
bright_green = "#4ade80"
bright_cyan = "#5eead4"
bright_blue = "#93c5fd"
bright_magenta = "#d8b4fe"
